  - benefit_shape:          # enum: B1_cost_avoidance | B2_labour_time_compression | B3_work_deflection | B4_revenue_generation | B5_loss_risk_reduction | B6_quality_error_reduction | B7_non_monetisable_mission_value
    description:
    unit:
    value_cur_p50:
    baseline_source:
    realisation_path:        # required if benefit_shape == B2

