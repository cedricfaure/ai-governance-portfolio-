# AI Use Case Business Card — machine-readable template.
# This is a template: every value below is a placeholder. See ../README.md for
# the framework and ../reference/ for the detail behind each field.
# Mirrors template/ai-use-case-business-card.md field for field.

block_1_identity:
  use_case_id:
  name:
  business_sponsor:        # named individual, not a function
  process_owner:            # end-to-end accountability
  technical_owner:
  risk_owner:
  date_raised:
  version:
  current_gate:              # enum: gate_0_intake | gate_1_pilot | gate_2_mvp | gate_3_scale | gate_4_sustain

block_2_problem_counterfactual:
  decision_or_task:
  current_performer:
  volume_per_period:
  counterfactual:            # does the avoided cost genuinely arrive?

block_3_workflow_delta:
